<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de TI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 16px;
      background: linear-gradient(135deg, #1b5e20, #7cb342);
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      color: #1f2937;
    }

    h1 {
      color: white;
      font-size: 28px;
      margin: 20px 0 30px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    #caixa {
      background-color: white;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 30px 24px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      animation: aparecer 0.4s ease;
    }

    /* texto "Pergunta 1 de 5" */
    #progresso-texto {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    /* barrinha de progresso */
    #barra {
      height: 8px;
      background-color: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    #barra-preenchida {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2e7d32, #8bc34a);
      transition: width 0.4s ease;
    }

    #pergunta {
      font-size: 22px;
      margin: 10px 0 20px;
    }

    #botoes p {
      font-size: 17px;
      line-height: 1.5;
      color: #4b5563;
    }

    button {
      display: block;
      width: 100%;
      margin: 12px auto;
      padding: 14px;
      font-size: 16px;
      font-family: inherit;
      background-color: #f3f4f6;
      color: #1f2937;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #2e7d32;
      border-color: #2e7d32;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(46, 125, 50, 0.35);
    }

    /* botao que a pessoa escolheu */
    button.escolhido {
      position: relative;
      background-color: #1b5e20;
      border-color: #1b5e20;
      color: white;
      transform: scale(1.03);
    }

    button:disabled:not(.escolhido) {
      opacity: 0.5;
      cursor: default;
      transform: none;
      box-shadow: none;
      background-color: #f3f4f6;
      border-color: #e5e7eb;
      color: #1f2937;
    }

    /* o "+1" que sobe quando clica */
    .mais-um {
      position: absolute;
      right: 15px;
      top: 50%;
      font-weight: bold;
      color: #1b5e20;
      background-color: white;
      padding: 2px 10px;
      border-radius: 20px;
      animation: subir 0.7s ease forwards;
    }

    @keyframes subir {
      from { opacity: 1; transform: translateY(-50%); }
      to { opacity: 0; transform: translateY(-250%); }
    }

    /* placar do resultado */
    .placar {
      text-align: left;
      margin: 20px 0;
    }

    .placar h3 {
      text-align: center;
      margin: 0 0 15px;
    }

    .linha-placar {
      margin-bottom: 12px;
    }

    .linha-placar .nome {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .barra-placar {
      height: 14px;
      background-color: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .barra-placar div {
      height: 100%;
      width: 0%;
      border-radius: 10px;
      transition: width 1s ease;
    }

    /* tela de resultado */
    .emoji {
      font-size: 70px;
      margin-top: 10px;
    }

    .botao-reiniciar {
      background: linear-gradient(90deg, #2e7d32, #8bc34a);
      color: white;
      border: none;
      font-weight: bold;
      margin-top: 25px;
    }

    /* propaganda da faculdade */
    .propaganda {
      margin-top: 25px;
      padding: 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f1f8e9, #e8f5e9);
      border: 2px dashed #2e7d32;
    }

    .propaganda img {
      max-width: 180px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    /* aparece no lugar do logo se a imagem nao carregar */
    .logo-texto {
      font-size: 28px;
      font-weight: bold;
      color: #2e7d32;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .propaganda h3 {
      margin: 5px 0 10px;
      color: #2e7d32;
      font-size: 20px;
    }

    #botoes .propaganda p {
      font-size: 15px;
      margin: 0;
    }

    /* rodape com os nomes do grupo */
    #creditos {
      max-width: 480px;
      margin: 30px auto 10px;
      color: white;
    }

    .titulo-creditos {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.85;
    }

    #creditos ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    #creditos li {
      background-color: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>💻 Qual área de TI combina com você?</h1>

  <div id="caixa">
    <div id="progresso-texto"></div>
    <div id="barra"><div id="barra-preenchida"></div></div>
    <h2 id="pergunta"></h2>
    <div id="botoes"></div>
  </div>

  <footer id="creditos">
    <p class="titulo-creditos">Desenvolvido por</p>
    <ul>
      <li>Renan Miranda</li>
      <li>Joao Antonio</li>
      <li>Alisson Mariano</li>
      <li>Ricardo Jhony</li>
      <li>Daniel Caitano</li>
    </ul>
  </footer>

  <script>
    // perguntas do quiz
    const perguntas = [
      {
        texto: "No trabalho em grupo, você é quem...",
        alternativas: [
          { texto: "Deixa os slides bonitos", perfil: "frontend" },
          { texto: "Faz a parte que ninguém vê", perfil: "backend" },
          { texto: "Organiza tudo numa planilha", perfil: "dados" }
        ]
      },
      {
        texto: "Num jogo, o que você mais gosta?",
        alternativas: [
          { texto: "Dos gráficos", perfil: "frontend" },
          { texto: "De como as coisas funcionam", perfil: "backend" },
          { texto: "Das estatísticas", perfil: "dados" }
        ]
      },
      {
        texto: "No fim de semana você prefere...",
        alternativas: [
          { texto: "Desenhar ou editar foto", perfil: "frontend" },
          { texto: "Montar ou consertar coisas", perfil: "backend" },
          { texto: "Ver curiosidades na internet", perfil: "dados" }
        ]
      },
      {
        texto: "Qual matéria da escola você curte mais?",
        alternativas: [
          { texto: "Artes", perfil: "frontend" },
          { texto: "Física", perfil: "backend" },
          { texto: "Matemática", perfil: "dados" }
        ]
      },
      {
        texto: "Quando você baixa um app novo, você...",
        alternativas: [
          { texto: "Repara se ele é bonito e fácil de usar", perfil: "frontend" },
          { texto: "Fica pensando em como ele foi feito", perfil: "backend" },
          { texto: "Olha as notas e quantas pessoas baixaram", perfil: "dados" }
        ]
      }
    ];

    // pontos de cada perfil
    let pontos = {
      frontend: 0,
      backend: 0,
      dados: 0
    };

    // nome, emoji e cor de cada perfil (usado no +1 e no placar)
    const infoPerfis = {
      frontend: { nome: "Front-end", emoji: "🎨", cor: "#8bc34a" },
      backend: { nome: "Back-end", emoji: "⚙️", cor: "#2e7d32" },
      dados: { nome: "Dados", emoji: "📊", cor: "#00897b" }
    };

    let perguntaAtual = 0;

    // funcao que mostra a pergunta na tela
    function mostrarPergunta() {
      let p = perguntas[perguntaAtual];

      // atualiza o progresso
      document.getElementById("progresso-texto").innerHTML =
        "Pergunta " + (perguntaAtual + 1) + " de " + perguntas.length;
      document.getElementById("barra-preenchida").style.width =
        (perguntaAtual / perguntas.length) * 100 + "%";

      document.getElementById("pergunta").innerHTML = p.texto;
      document.getElementById("botoes").innerHTML = "";

      for (let i = 0; i < p.alternativas.length; i++) {
        let botao = document.createElement("button");
        botao.innerHTML = p.alternativas[i].texto;
        botao.onclick = function() {
          responder(p.alternativas[i].perfil, botao);
        };
        document.getElementById("botoes").appendChild(botao);
      }

      animarCaixa();
    }

    // quando clica em uma resposta
    function responder(perfil, botao) {
      pontos[perfil] = pontos[perfil] + 1;
      perguntaAtual = perguntaAtual + 1;

      // trava os botoes para nao clicar duas vezes
      let todos = document.querySelectorAll("#botoes button");
      for (let i = 0; i < todos.length; i++) {
        todos[i].disabled = true;
      }

      // pinta o botao escolhido e mostra o +1 subindo
      botao.classList.add("escolhido");
      let maisUm = document.createElement("span");
      maisUm.className = "mais-um";
      maisUm.innerHTML = "+1 " + infoPerfis[perfil].emoji;
      botao.appendChild(maisUm);

      // espera um pouquinho antes de ir para a proxima
      setTimeout(function() {
        if (perguntaAtual < perguntas.length) {
          mostrarPergunta();
        } else {
          mostrarResultado();
        }
      }, 700);
    }

    // monta o placar com uma barra para cada perfil
    function montarPlacar() {
      let html = "<div class='placar'><h3>Sua pontuação</h3>";

      for (let perfil in infoPerfis) {
        let info = infoPerfis[perfil];
        html +=
          "<div class='linha-placar'>" +
            "<div class='nome'>" +
              "<span>" + info.emoji + " " + info.nome + "</span>" +
              "<strong><span id='porcento-" + perfil + "'>0</span>%</strong>" +
            "</div>" +
            "<div class='barra-placar'>" +
              "<div id='barra-" + perfil + "' style='background-color: " + info.cor + "'></div>" +
            "</div>" +
          "</div>";
      }

      return html + "</div>";
    }

    // faz as barras crescerem e os numeros contarem de 0 ate a porcentagem
    function animarPlacar() {
      for (let perfil in infoPerfis) {
        let porcentagem = Math.round((pontos[perfil] / perguntas.length) * 100);
        let numero = document.getElementById("porcento-" + perfil);
        let atual = 0;

        document.getElementById("barra-" + perfil).style.width = porcentagem + "%";

        let contador = setInterval(function() {
          if (atual >= porcentagem) {
            clearInterval(contador);
            return;
          }
          atual = atual + 1;
          numero.innerHTML = atual;
        }, 10);
      }
    }

    // mostra o resultado final
    function mostrarResultado() {
      let vencedor = "frontend";

      // ve qual tem mais pontos
      // se der empate fica o que apareceu primeiro
      if (pontos.backend > pontos[vencedor]) {
        vencedor = "backend";
      }
      if (pontos.dados > pontos[vencedor]) {
        vencedor = "dados";
      }

      let emoji = "";
      let titulo = "";
      let texto = "";

      if (vencedor == "frontend") {
        emoji = "🎨";
        titulo = "Você é Front-end!";
        texto = "O front-end faz a parte do site que as pessoas veem, como as telas, botões e menus.";
      }
      if (vencedor == "backend") {
        emoji = "⚙️";
        titulo = "Você é Back-end!";
        texto = "O back-end faz a parte que fica por trás do site, como salvar os dados e fazer o login funcionar.";
      }
      if (vencedor == "dados") {
        emoji = "📊";
        titulo = "Você é de Dados!";
        texto = "Quem trabalha com dados analisa muitas informações para ajudar a empresa a tomar decisões.";
      }

      document.getElementById("progresso-texto").innerHTML = "Resultado";
      document.getElementById("barra-preenchida").style.width = "100%";
      document.getElementById("pergunta").innerHTML =
        "<div class='emoji'>" + emoji + "</div>" + titulo;
      document.getElementById("botoes").innerHTML =
        "<p>" + texto + "</p>" +
        montarPlacar() +
        "<div class='propaganda'>" +
